<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>MHDLabs — Motion Identity / Showreel</title>
<style>
/* ============================================================
   MHDLabs — Motion Identity / Showreel
   Single-file. No dependencies. Everything procedural.
   ============================================================ */

:root{
  --bg:#05070a;
  --ink:#e9f3f5;
  --grn:#00ff9d;
  --red:#ff2e5b;
  --blu:#5b8cff;
  --dim:#4a5a63;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --disp:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;width:100%;overflow:hidden;
  background:#05070a;color:var(--ink);
  font-family:var(--mono);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

#stage{
  position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 85% at 50% 42%, #0a1016 0%, #060a0e 55%, #020304 100%);
}
#shake{position:absolute;inset:0;will-change:transform;transform:translate3d(0,0,0);}
canvas{position:absolute;inset:0;display:block;}
#bg{z-index:1;}
#fx{z-index:2;}
#layer{z-index:3;position:absolute;inset:0;overflow:hidden;}
#hud{z-index:5;position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease;}
#hud.on{opacity:1;}

/* ---------- overlays ---------- */
#scan{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,.045) 0px, rgba(255,255,255,.045) 1px,
    transparent 1px, transparent 3px);
  mix-blend-mode:overlay;opacity:.55;
}
#scan::after{
  content:'';position:absolute;left:0;right:0;height:26vh;
  background:linear-gradient(to bottom,transparent,rgba(0,255,157,.07) 45%,transparent);
  animation:scanMove 4.6s linear infinite;
}
@keyframes scanMove{from{top:-28vh}to{top:106vh}}

#grain{
  position:absolute;inset:-60%;z-index:7;pointer-events:none;opacity:.055;
  background-repeat:repeat;
  animation:grainMove .55s steps(4) infinite;
}
@keyframes grainMove{
  0%{transform:translate3d(0,0,0)}
  25%{transform:translate3d(-2%,1.5%,0)}
  50%{transform:translate3d(1.5%,-2%,0)}
  75%{transform:translate3d(-1%,2%,0)}
  100%{transform:translate3d(0,0,0)}
}

#vig{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.35), transparent 18%, transparent 82%, rgba(0,0,0,.45));
}
#flash{position:absolute;inset:0;z-index:9;pointer-events:none;background:#eafff6;opacity:0;}

/* ---------- HUD ---------- */
.hk{position:absolute;width:16px;height:16px;border:1px solid rgba(0,255,157,.5);}
.hk.tl{top:14px;left:14px;border-right:0;border-bottom:0;}
.hk.tr{top:14px;right:14px;border-left:0;border-bottom:0;}
.hk.bl{bottom:14px;left:14px;border-right:0;border-top:0;}
.hk.br{bottom:14px;right:14px;border-left:0;border-top:0;}

.hud-tl,.hud-tr,.hud-bl,.hud-br{
  position:absolute;font-size:9.5px;letter-spacing:.14em;color:rgba(233,243,245,.62);
  text-transform:uppercase;white-space:nowrap;
}
.hud-tl{top:20px;left:40px;}
.hud-tr{top:20px;right:40px;display:flex;align-items:center;gap:7px;}
.hud-bl{bottom:20px;left:40px;color:rgba(0,255,157,.7);}
.hud-br{bottom:20px;right:40px;color:rgba(91,140,255,.75);}
.recdot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;
  animation:recPulse 1.1s ease-in-out infinite;box-shadow:0 0 8px var(--red);}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.15}}

#audioBtn{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  pointer-events:auto;background:transparent;border:1px solid rgba(0,255,157,.28);
  color:rgba(0,255,157,.75);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;padding:6px 12px;cursor:pointer;text-transform:uppercase;
  transition:.2s;border-radius:2px;
}
#audioBtn:hover{border-color:var(--grn);color:var(--grn);}
#audioBtn.on{background:rgba(0,255,157,.12);color:var(--grn);border-color:var(--grn);}

@media (max-width:700px){
  .hud-tl{left:30px;top:16px;font-size:8px;}
  .hud-tr{right:30px;top:16px;font-size:8px;}
  .hud-bl{left:30px;bottom:16px;font-size:8px;}
  .hud-br{right:30px;bottom:16px;font-size:8px;}
  .hk{width:12px;height:12px;}
  #audioBtn{bottom:9px;font-size:8px;padding:5px 9px;}
}

/* ============================================================
   GENERIC SCENE PIECES
   ============================================================ */
.cutwrap{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:clamp(16px,5vw,80px);gap:clamp(8px,1.6vh,22px);
  text-align:center;
}
.c-dim{color:var(--dim);}
.c-grn{color:var(--grn);}
.c-red{color:var(--red);}
.c-blu{color:var(--blu);}

.l{display:inline-block;will-change:transform,opacity;}

/* --- boot terminal --- */
.bootwrap{justify-content:flex-start;padding-top:clamp(60px,16vh,180px);align-items:flex-start;
  text-align:left;padding-left:clamp(20px,7vw,120px);}
.term{font-size:clamp(11px,1.55vw,17px);letter-spacing:.02em;white-space:nowrap;}
.cur{display:inline-block;width:.62em;height:1.05em;background:var(--grn);vertical-align:-.18em;
  margin-left:2px;animation:blink .55s steps(1) infinite;box-shadow:0 0 10px rgba(0,255,157,.8);}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.boot-out{margin-top:14px;font-size:clamp(9.5px,1.2vw,13px);line-height:1.75;}
.boot-out>div{opacity:0;animation:fadeSlide .3s ease-out forwards;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* --- impact / wordmark --- */
.impact{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(10px,2.4vh,28px);
}
.impact-sub,.impact-sub2{
  font-size:clamp(8px,1.05vw,12px);letter-spacing:.42em;text-transform:uppercase;
  color:rgba(0,255,157,.8);opacity:0;animation:fadeSlide .45s .5s ease-out forwards;
}
.impact-sub2{color:rgba(233,243,245,.4);letter-spacing:.34em;animation-delay:.72s;}

.wm-wrap{position:relative;display:inline-block;line-height:.9;}
.wm-layer{
  font-family:var(--disp);font-weight:900;
  font-size:clamp(46px,13.5vw,240px);
  letter-spacing:-.05em;line-height:.9;white-space:nowrap;
}
.wm-base{position:relative;color:var(--ink);}
.wm-r,.wm-c{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .07s linear;mix-blend-mode:screen;}
.wm-r{color:#ff2e5b;text-shadow:0 0 26px rgba(255,46,91,.7);}
.wm-c{color:#25d8ff;text-shadow:0 0 26px rgba(37,216,255,.7);}
.wm-wrap.glitch .wm-r{opacity:.85;animation:jitR .14s steps(2) infinite;}
.wm-wrap.glitch .wm-c{opacity:.85;animation:jitC .17s steps(2) infinite;}
.wm-wrap.glitch .wm-base{animation:jitM .1s steps(2) infinite;}
@keyframes jitR{0%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}100%{transform:translate(-2px,-2px)}}
@keyframes jitC{0%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(2px,2px)}}
@keyframes jitM{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}

@keyframes assemble{
  0%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(2.6) rotate(var(--rz));filter:blur(12px);}
  55%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg);filter:blur(0);}
}
.asm{animation:assemble .62s cubic-bezier(.15,.85,.2,1) both;
  animation-delay:calc(var(--i) * 38ms);}

/* --- window / panel chrome --- */
.win{
  border:1px solid rgba(0,255,157,.22);background:rgba(6,12,16,.72);
  backdrop-filter:blur(2px);border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 22px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(0,255,157,.035);
}
.win-bar{display:flex;align-items:center;gap:7px;padding:8px 12px;
  border-bottom:1px solid rgba(0,255,157,.15);background:rgba(0,255,157,.035);}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(233,243,245,.16);}
.dot:first-child{background:rgba(255,46,91,.55);}
.dot:nth-child(2){background:rgba(255,190,60,.5);}
.dot:nth-child(3){background:rgba(0,255,157,.5);}
.win-title{margin-left:8px;font-size:10px;letter-spacing:.1em;color:rgba(233,243,245,.5);}
.win-body{padding:clamp(12px,1.6vw,20px);font-size:clamp(9.5px,1.15vw,13px);line-height:1.85;
  white-space:pre;overflow:hidden;text-align:left;}

/* --- misc display type --- */
.huge-mono{
  font-family:var(--mono);font-weight:700;
  font-size:clamp(28px,8.4vw,132px);letter-spacing:-.02em;line-height:.95;
}
.outline-text{
  font-family:var(--disp);font-weight:900;
  font-size:clamp(56px,19vw,300px);line-height:.82;letter-spacing:-.055em;
  color:transparent;-webkit-text-stroke:2px var(--grn);
  text-stroke:2px var(--grn);
}
.meta{font-size:clamp(8px,1.05vw,12px);letter-spacing:.22em;text-transform:uppercase;color:rgba(233,243,245,.45);}
.meta-grn{color:rgba(0,255,157,.75);}

.bar{width:min(560px,74vw);height:5px;background:rgba(233,243,245,.09);position:relative;overflow:hidden;border-radius:1px;}
.bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--grn),#9dffd2);
  box-shadow:0 0 14px rgba(0,255,157,.6);}
@keyframes fill{from{right:100%}to{right:0%}}

/* --- scene entrance helpers --- */
@keyframes inRight{from{opacity:0;transform:translateX(16vw) skewX(-14deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes inLeft{from{opacity:0;transform:translateX(-16vw) skewX(14deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes inZoom{from{opacity:0;transform:scale(1.7);filter:blur(14px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes inUp{from{opacity:0;transform:translateY(9vh)}to{opacity:1;transform:none}}
@keyframes inMask{from{clip-path:inset(100% 0 0 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes inHard{0%{opacity:0;clip-path:inset(0 100% 0 0)}45%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}

.anim-right{animation:inRight .42s cubic-bezier(.14,.9,.2,1) both;}
.anim-left{animation:inLeft .42s cubic-bezier(.14,.9,.2,1) both;}
.anim-zoom{animation:inZoom .38s cubic-bezier(.14,.9,.2,1) both;}
.anim-up{animation:inUp .42s cubic-bezier(.14,.9,.2,1) both;}
.anim-mask{animation:inMask .5s cubic-bezier(.2,.9,.2,1) both;}
.anim-hard{animation:inHard .34s steps(8) both;}

/* --- kinetic typography --- */
.kin-stage{position:absolute;inset:0;overflow:hidden;}
.kin{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:900;letter-spacing:-.045em;line-height:.86;
  white-space:nowrap;will-change:transform,opacity;
  animation:kinLife .74s cubic-bezier(.2,.85,.2,1) forwards;
}
@keyframes kinLife{
  0%{opacity:1;transform:none;filter:blur(0)}
  60%{opacity:1;transform:none;filter:blur(0)}
  100%{opacity:0;transform:scale(1.07) translateY(-2.5vh);filter:blur(5px)}
}
.kin .l{animation-duration:.42s;animation-timing-function:cubic-bezier(.16,.9,.2,1);
  animation-fill-mode:both;animation-delay:calc(var(--i) * 30ms);}

@keyframes kRise{0%{opacity:0;transform:translateY(95%) scaleY(1.6)}100%{opacity:1;transform:none}}
@keyframes kZoom{0%{opacity:0;transform:scale(3.2);filter:blur(18px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes kFocus{0%{opacity:0;filter:blur(16px);transform:scale(1.5)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes kFlip{0%{opacity:0;transform:perspective(700px) rotateX(96deg) translateY(-24px)}100%{opacity:1;transform:none}}
@keyframes kSkew{0%{opacity:0;transform:skewX(-48deg) translateX(-80px)}100%{opacity:1;transform:none}}
@keyframes kDrop{0%{opacity:0;transform:translateY(-150%) rotate(-11deg)}100%{opacity:1;transform:none}}
@keyframes kSplit{0%{opacity:0;transform:translateX(var(--sx,90px)) scaleY(.12)}100%{opacity:1;transform:none}}
@keyframes kGlitch{0%{opacity:0;transform:translateX(var(--tx,60px)) skewX(34deg);filter:hue-rotate(120deg)}
  40%{opacity:1;transform:translateX(calc(var(--tx,60px) * -.35)) skewX(-12deg)}
  100%{opacity:1;transform:none;filter:none}}

.kRise{animation-name:kRise} .kZoom{animation-name:kZoom} .kFocus{animation-name:kFocus}
.kFlip{animation-name:kFlip} .kSkew{animation-name:kSkew} .kDrop{animation-name:kDrop}
.kSplit{animation-name:kSplit} .kGlitch{animation-name:kGlitch}

/* --- system overload --- */
.overload{
  position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:clamp(8px,1.4vw,22px);
  padding:clamp(38px,7vh,90px) clamp(16px,4vw,64px);
  align-items:center;
}
.ov-col{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,18px);}
.panel{
  border:1px solid rgba(0,255,157,.18);background:rgba(6,12,16,.55);
  border-radius:2px;overflow:hidden;backdrop-filter:blur(2px);
}
.p-h{padding:5px 9px;font-size:9px;letter-spacing:.2em;color:rgba(0,255,157,.72);
  border-bottom:1px solid rgba(0,255,157,.13);background:rgba(0,255,157,.04);
  display:flex;justify-content:space-between;}
.p-b{padding:9px;font-size:clamp(8.5px,1.02vw,11.5px);line-height:1.72;color:rgba(233,243,245,.72);}
.ov-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ring{width:min(46vh,42vw);height:min(46vh,42vw);max-width:420px;max-height:420px;}
.ring .g1{transform-origin:100px 100px;animation:spin 6.5s linear infinite;}
.ring .g2{transform-origin:100px 100px;animation:spin 11s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg)}}
.core-label{font-size:clamp(9px,1.15vw,13px);letter-spacing:.34em;color:rgba(0,255,157,.85);
  text-shadow:0 0 18px rgba(0,255,157,.55);}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;}
.spark i{flex:1;background:linear-gradient(to top,rgba(0,255,157,.15),var(--grn));min-height:2px;
  transition:height .1s linear;}
.bars{display:flex;flex-direction:column;gap:7px;}
.brow{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.08em;}
.brow .track{flex:1;height:4px;background:rgba(233,243,245,.08);position:relative;overflow:hidden;}
.brow .track i{position:absolute;inset:0 auto 0 0;background:var(--grn);box-shadow:0 0 10px rgba(0,255,157,.5);}
.brow .track i.warn{background:var(--red);box-shadow:0 0 10px rgba(255,46,91,.55);}

@media (max-width:860px){
  .overload{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-top:56px;padding-bottom:56px;}
  .ov-col.left{order:2;}
  .ov-col.right{display:none;}
  .ov-center{order:1;}
  .ring{width:min(30vh,58vw);height:min(30vh,58vw);}
  .p-b{font-size:8.5px;line-height:1.6;}
}

/* --- chaos helpers --- */
.chaos-giant{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:900;letter-spacing:-.06em;
  font-size:clamp(52px,20vw,340px);line-height:.82;color:var(--ink);
  animation:chaosIn .45s cubic-bezier(.1,.9,.2,1) both, chaosOut .3s .35s ease-in forwards;
}
@keyframes chaosIn{from{opacity:0;transform:scale(2.4) rotate(-6deg);filter:blur(24px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes chaosOut{to{opacity:0;transform:scale(.7) rotate(3deg);filter:blur(16px)}}

.rot-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:900;font-size:clamp(46px,15vw,260px);
  letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px rgba(0,255,157,.85);
  animation:rotIn .6s ease-out both;
}
@keyframes rotIn{from{opacity:0;transform:rotate(-16deg) scale(1.6)}to{opacity:1;transform:none}}

.invert-flash{
  position:absolute;inset:0;background:#eafff6;display:flex;align-items:center;justify-content:center;
  animation:invLife .55s steps(2) forwards;
}
.invert-flash>div{
  font-family:var(--disp);font-weight:900;font-size:clamp(26px,7vw,120px);
  color:#05070a;letter-spacing:-.04em;text-align:center;padding:0 6vw;
}
@keyframes invLife{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* --- identity lock --- */
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.lock-frame{position:absolute;inset:clamp(28px,7vw,110px);}
.fl{position:absolute;width:clamp(22px,4.5vw,58px);height:clamp(22px,4.5vw,58px);
  border:1px solid rgba(0,255,157,.55);opacity:0;animation:fadeSlide .5s .25s ease-out forwards;}
.fl.tl{top:0;left:0;border-right:0;border-bottom:0;}
.fl.tr{top:0;right:0;border-left:0;border-bottom:0;}
.fl.bl{bottom:0;left:0;border-right:0;border-top:0;}
.fl.br{bottom:0;right:0;border-left:0;border-top:0;}

.lock-mid{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,26px);}
.lock-mark{
  font-family:var(--disp);font-weight:900;letter-spacing:-.05em;line-height:.9;
  font-size:clamp(50px,14.5vw,250px);color:var(--ink);
  text-shadow:0 0 60px rgba(0,255,157,.28), 0 0 140px rgba(0,255,157,.14);
  white-space:nowrap;
}
.lock-mark .l{animation:lockIn .7s cubic-bezier(.16,.9,.2,1) both;
  animation-delay:calc(var(--i) * 55ms);}
@keyframes lockIn{from{opacity:0;transform:translateY(70%) rotateX(70deg);filter:blur(10px)}
  to{opacity:1;transform:none;filter:blur(0)}}
.lock-tag{
  font-size:clamp(8px,1.1vw,12px);letter-spacing:.5em;text-transform:uppercase;
  color:rgba(0,255,157,.8);opacity:0;animation:fadeSlide .8s 1.1s ease-out forwards;
  padding-left:.5em;text-align:center;
}
.lock-micro{position:absolute;inset:0;pointer-events:none;}
.lock-micro span{
  position:absolute;font-size:9px;letter-spacing:.18em;color:rgba(233,243,245,.34);
  opacity:0;animation:fadeSlide .5s ease-out forwards;
}

/* --- stream / collapse --- */
.stream{position:absolute;top:-20%;font-size:11px;line-height:1.5;letter-spacing:.06em;
  color:rgba(0,255,157,.45);white-space:pre;animation:streamFall linear forwards;}
@keyframes streamFall{from{transform:translateY(-30%)}to{transform:translateY(150vh)}}

.collapse-panel{
  position:absolute;border:1px solid rgba(0,255,157,.3);background:rgba(6,12,16,.7);
  padding:10px;font-size:10px;color:rgba(233,243,245,.65);
  animation:collapse .8s cubic-bezier(.5,.05,.9,.3) forwards;
}
@keyframes collapse{
  0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}
  18%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(.25);filter:blur(6px)}
}

/* --- final --- */
.final-wrap{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(14px,3vh,36px);
}
.final-mark{
  font-family:var(--disp);font-weight:900;letter-spacing:-.05em;line-height:.9;
  font-size:clamp(52px,15vw,260px);white-space:nowrap;
  color:var(--ink);
  text-shadow:0 0 70px rgba(0,255,157,.3), 0 0 180px rgba(0,255,157,.15);
  animation:finalIn 1.1s cubic-bezier(.16,.9,.2,1) both;
}
@keyframes finalIn{
  0%{opacity:0;transform:scale(1.5);filter:blur(30px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.final-sub{

<body>

<div id="stage">
  <div id="shake">
    <canvas id="bg"></canvas>
    <canvas id="fx"></canvas>
    <div id="layer"></div>

    <div id="hud">
      <div class="hk tl"></div><div class="hk tr"></div>
      <div class="hk bl"></div><div class="hk br"></div>
      <div class="hud-tl">MHDLABS<span class="c-dim"> // </span>SHOWREEL_01</div>
      <div class="hud-tr">REC <i class="recdot"></i></div>
      <div class="hud-bl" id="hudTC">00:00:00:00</div>
      <div class="hud-br" id="hudState">SYS.OK</div>
      <button id="audioBtn" type="button">♪ AUDIO OFF</button>
    </div>

    <div id="scan"></div>
    <div id="grain"></div>
  </div>
  <div id="vig"></div>
  <div id="flash"></div>
</div>

<script>
"use strict";
/* ============================================================
   0. UTILITIES
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a = 0, b = 1) => a + Math.random() * (b - a);
const ri    = (a, b) => Math.floor(rnd(a, b + 1));
const pick  = (arr) => arr[Math.floor(Math.random() * arr.length)];
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

const MOBILE   = window.matchMedia("(max-width: 760px)").matches ||
                 /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const LOWPOWER = MOBILE || (navigator.hardwareConcurrency || 4) <= 4;
const QUALITY  = LOWPOWER ? 0.55 : 1;

/* ============================================================
   1. CANVAS SETUP
   ============================================================ */
const bgC = $("#bg"), fxC = $("#fx");
const bctx = bgC.getContext("2d", { alpha: true });
const fctx = fxC.getContext("2d", { alpha: true });
let W = window.innerWidth, H = window.innerHeight, DPR = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, LOWPOWER ? 1.5 : 2);
  [bgC, fxC].forEach((c) => {
    c.width  = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    c.style.width  = W + "px";
    c.style.height = H + "px";
  });
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initNodes(LOWPOWER ? 24 : 54);
}

/* ============================================================
   2. BACKGROUND SYSTEMS
   ============================================================ */
const bg = {
  grid: 0, gridT: 0,
  nodes: 0, nodesT: 0,
  wave: 0, waveT: 0,
  radial: 0, radialT: 0,
  poly: 0, polyT: 0
};

function bgTo(o) {
  for (const k in o) if (k + "T" in bg) bg[k + "T"] = o[k];
}
function bgUpdate(dt) {
  const k = 1 - Math.pow(0.0015, dt);
  ["grid", "nodes", "wave", "radial", "poly"].forEach((key) => {
    bg[key] = lerp(bg[key], bg[key + "T"], k);
  });
}

/* --- node network --- */
const nodes = [];
function initNodes(n) {
  nodes.length = 0;
  for (let i = 0; i < n; i++) {
    nodes.push({
      x: rnd(0, W), y: rnd(0, H),
      vx: rnd(-16, 16), vy: rnd(-16, 16),
      r: rnd(0.7, 2.1)
    });
  }
}

/* --- grid --- */
function drawGrid(t) {
  const a = bg.grid;
  if (a < 0.006) return;
  const sp = Math.max(38, Math.min(W, H) / 12);
  const ox = (t * 24) % sp, oy = (t * 16) % sp;

  bctx.lineWidth = 1;
  bctx.strokeStyle = "rgba(0,255,157," + (0.075 * a) + ")";
  bctx.beginPath();
  for (let x = -sp + ox; x < W + sp; x += sp) { bctx.moveTo(x, 0); bctx.lineTo(x, H); }
  for (let y = -sp + oy; y < H + sp; y += sp) { bctx.moveTo(0, y); bctx.lineTo(W, y); }
  bctx.stroke();

  bctx.strokeStyle = "rgba(0,255,157," + (0.14 * a) + ")";
  bctx.beginPath();
  for (let x = -sp + ox; x < W + sp; x += sp * 4) { bctx.moveTo(x, 0); bctx.lineTo(x, H); }
  bctx.stroke();
}

/* --- nodes --- */
function drawNodes(t, dt) {
  const a = bg.nodes;
  if (a < 0.006) return;
  const n = nodes, len = n.length;

  for (let i = 0; i < len; i++) {
    const p = n[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
    if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
  }

  const maxD = LOWPOWER ? 140 : 185;
  const maxD2 = maxD * maxD;
  bctx.lineWidth = 1;
  for (let i = 0; i < len; i++) {
    const pi = n[i];
    for (let j = i + 1; j < len; j++) {
      const pj = n[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxD2) {
        const al = (1 - Math.sqrt(d2) / maxD) * 0.3 * a;
        bctx.strokeStyle = "rgba(0,255,157," + al.toFixed(3) + ")";
        bctx.beginPath();
        bctx.moveTo(pi.x, pi.y);
        bctx.lineTo(pj.x, pj.y);
        bctx.stroke();
      }
    }
  }
  bctx.fillStyle = "rgba(190,255,225," + (0.75 * a) + ")";
  for (let i = 0; i < len; i++) {
    const p = n[i];
    bctx.beginPath();
    bctx.arc(p.x, p.y, p.r, 0, 6.2832);
    bctx.fill();
  }
}

/* --- waves --- */
function drawWave(t) {
  const a = bg.wave;
  if (a < 0.006) return;
  const N = LOWPOWER ? 3 : 5;
  for (let k = 0; k < N; k++) {
    bctx.beginPath();
    const amp = H * 0.055 * (1 + k * 0.4);
    const ph = t * (0.6 + k * 0.24) + k * 1.7;
    for (let x = 0; x <= W; x += 10) {
      const y = H * 0.5 +
        Math.sin(x * 0.0075 + ph) * amp +
        Math.sin(x * 0.021 - ph * 1.7) * amp * 0.32;
      if (x === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
    }
    bctx.strokeStyle = "rgba(91,140,255," + ((0.2 - k * 0.028) * a).toFixed(3) + ")";
    bctx.lineWidth = 1.2;
    bctx.stroke();
  }
}

/* --- radial spokes --- */
function drawRadial(t) {
  const a = bg.radial;
  if (a < 0.006) return;
  const cx = W / 2, cy = H / 2;
  const R = Math.hypot(W, H) * 0.55;
  const spokes = LOWPOWER ? 26 : 48;

  bctx.lineWidth = 1;
  for (let i = 0; i < spokes; i++) {
    const ang = (i / spokes) * Math.PI * 2 + t * 0.38;
    const inner = R * (0.1 + 0.07 * Math.sin(t * 1.5 + i));
    bctx.strokeStyle = "rgba(0,255,157," + (0.085 * a).toFixed(3) + ")";
    bctx.beginPath();
    bctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    bctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
    bctx.stroke();
  }
  for (let i = 1; i <= 4; i++) {
    const r = ((R * 0.2 * i) + (t * 46) % 90) % R;
    bctx.strokeStyle = "rgba(0,255,157," + (0.1 * a * (1 - r / R)).toFixed(3) + ")";
    bctx.beginPath();
    bctx.arc(cx, cy, r, 0, 6.2832);
    bctx.stroke();
  }
}

/* --- rotating polygons --- */
function drawPoly(t) {
  const a = bg.poly;
  if (a < 0.006) return;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.4;
  const layers = LOWPOWER ? 3 : 5;

  for (let L = 0; L < layers; L++) {
    const sides = 3 + ((L + Math.floor(t * 0.55)) % 6);
    const rot = t * (0.45 + L * 0.26) * (L % 2 ? -1 : 1);
    const rr = R * (1 - L * 0.135) * (0.9 + 0.1 * Math.sin(t * 2.1 + L));
    bctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const ang = rot + (i / sides) * Math.PI * 2;
      const x = cx + Math.cos(ang) * rr;
      const y = cy + Math.sin(ang) * rr * 0.94;
      if (i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
    }
    bctx.closePath();
    bctx.strokeStyle = "rgba(0,255,157," + ((0.15 - L * 0.018) * a).toFixed(3) + ")";
    bctx.lineWidth = 1.2;
    bctx.stroke();
  }
}

function drawBG(t, dt) {
  bctx.clearRect(0, 0, W, H);
  drawGrid(t);
  drawPoly(t);
  drawRadial(t);
  drawWave(t);
  drawNodes(t, dt);
}

/* ============================================================
   3. FX SYSTEM — PARTICLES + RINGS
   ============================================================ */
const parts = [];
const rings = [];
const MAXP = LOWPOWER ? 300 : 800;

function spawnBurst(x, y, count, opt) {
  opt = opt || {};
  const room = MAXP - parts.length;
  const n = Math.min(count, Math.max(0, room));
  for (let i = 0; i < n; i++) {
    const ang = opt.ang !== undefined
      ? opt.ang + rnd(-(opt.spread || 0.6), opt.spread || 0.6)
      : rnd(0, 6.2832);
    const sp = rnd(opt.smin || 70, opt.smax || 430);
    parts.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 0,
      max: rnd(opt.lmin || 0.35, opt.lmax || 1.15),
      size: rnd(opt.szmin || 1, opt.szmax || 3.2),
      col: opt.col || "0,255,157",
      drag: opt.drag || 0.93,
      grav: opt.grav || 0
    });
  }
}

function spawnRing(x, y, opt) {
  opt = opt || {};
  rings.push({
    x: x, y: y,
    r0: opt.r0 || 0,
    max: opt.r1 || 320,
    life: 0,
    dur: opt.dur || 0.7,
    col: opt.col || "0,255,157",
    w: opt.w || 2
  });
}

function fxUpdate(dt) {
  /* trail fade — destination-out keeps the canvas transparent */
  fctx.globalCompositeOperation = "destination-out";
  fctx.fillStyle = "rgba(0,0,0," + (LOWPOWER ? 0.34 : 0.22) + ")";
  fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = "lighter";

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const a = 1 - p.life / p.max;
    fctx.fillStyle = "rgba(" + p.col + "," + (a * 0.9).toFixed(3) + ")";
    const s = p.size * (0.35 + a * 0.65);
    fctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life += dt;
    const p = r.life / r.dur;
    if (p >= 1) { rings.splice(i, 1); continue; }
    const rad = r.r0 + (r.max - r.r0) * easeOut(p);
    fctx.strokeStyle = "rgba(" + r.col + "," + ((1 - p) * 0.85).toFixed(3) + ")";
    fctx.lineWidth = r.w * (1 - p) + 0.4;
    fctx.beginPath();
    fctx.arc(r.x, r.y, rad, 0, 6.2832);
    fctx.stroke();
  }
}

/* ============================================================
   4. GLOBAL SCREEN EFFECTS — flash, shake
   ============================================================ */
const flashEl = $("#flash");
const shakeEl = $("#shake");
let flashV = 0;
let shakeAmp = 0;

function doFlash(a) { flashV = Math.max(flashV, a); }
function shake(v)   { shakeAmp = Math.max(shakeAmp, v); }

function updateScreenFX(dt) {
  /* flash */
  if (flashV > 0) {
    flashV = Math.max(0, flashV - dt * 6.5);
    flashEl.style.opacity = flashV.toFixed(3);
  } else if (flashEl.style.opacity !== "0") {
    flashEl.style.opacity = "0";
  }

  /* shake */
  if (shakeAmp > 0.15) {
    const x = rnd(-1, 1) * shakeAmp;
    const y = rnd(-1, 1) * shakeAmp;
    const r = rnd(-1, 1) * shakeAmp * 0.05;
    shakeEl.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0) rotate(" + r.toFixed(3) + "deg)";
    shakeAmp *= Math.pow(0.02, dt);
  } else if (shakeAmp !== 0) {
    shakeAmp = 0;
    shakeEl.style.transform = "translate3d(0,0,0)";
  }
}

/* ============================================================
   5. HUD
   ============================================================ */
const hudEl = $("#hud");
const hudTC = $("#hudTC");
const hudState = $("#hudState");
let tcAccum = 0;

function hudOn(on) { hudEl.classList.toggle("on", !!on); }

function formatTC(t) {
  const f = Math.floor((t % 1) * 24);
  const s = Math.floor(t) % 60;
  const m = Math.floor(t / 60) % 60;
  return "00:" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + ":" + String(f).padStart(2, "0");
}

/* ============================================================
   6. PROCEDURAL GRAIN TEXTURE
   ============================================================ */
function buildNoise() {
  const n = document.createElement("canvas");
  n.width = n.height = 128;
  const c = n.getContext("2d");
  const img = c.createImageData(128, 128);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = (Math.random() * 68) | 0;
  }
  c.putImageData(img, 0, 0);
  $("#grain").style.backgroundImage = "url(" + n.toDataURL() + ")";
}

/* ============================================================
   7. OPTIONAL PROCEDURAL AUDIO
   ============================================================ */
const Snd = {
  ctx: null, on: false, master: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.16;
    this.master.connect(this.ctx.destination);
  },
  toggle() {
    this.init();
    if (!this.ctx) return;
    this.on = !this.on;
    if (this.on && this.ctx.state === "suspended") this.ctx.resume();
    const b = $("#audioBtn");
    b.textContent = this.on ? "♪ AUDIO ON" : "♪ AUDIO OFF";
    b.classList.toggle("on", this.on);
  },
  blip(freq, dur, type, vol) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), t + dur);
    g.gain.setValueAtTime(vol || 0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  sub() {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.45);
    g.gain.setValueAtTime(0.75, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.55);
  }
};
$("#audioBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  Snd.toggle();
});

/* ============================================================
   8. DOM / TEXT HELPERS
   ============================================================ */
const layerEl = $("#layer");

function setLayer(html) { layerEl.innerHTML = html; }

/** Build an animated "assembled" word where each glyph flies in. */
function assembleWord(word, cls) {
  return Array.prototype.map.call(word, (ch, i) => {
    const tx = (Math.random() - 0.5) * 280;
    const ty = (Math.random() - 0.5) * 190;
    const rz = (Math.random() - 0.5) * 70;
    return '<span class="l asm ' + (cls || "") + '" style="--i:' + i +
      ";--tx:" + tx.toFixed(0) + "px;--ty:" + ty.toFixed(0) + "px;--rz:" + rz.toFixed(0) + 'deg">' +
      ch + "</span>";
  }).join("");
}

/** Build kinetic letters with a given animation class. */
function kinLetters(word, anim) {
  return Array.prototype.map.call(word, (ch, i) => {
    const tx = (Math.random() - 0.5) * 130;
    const sx = (Math.random() < 0.5 ? -1 : 1) * rnd(70, 190);
    return '<span class="l ' + anim + '" style="--i:' + i +
      ";--tx:" + tx.toFixed(0) + "px;--sx:" + sx.toFixed(0) + 'px">' +
      (ch === " " ? "&nbsp;" : ch) + "</span>";
  }).join("");
}

/** Type text into an element over a duration (driven by the master clock). */
function typeInto(id, text, dur, delay, onDone) {
  const t0 = showT + (delay || 0);
  let done = false;
  ticker((t) => {
    const el = document.getElementById(id);
    if (!el) { return; }
    const p = clamp((t - t0) / dur, 0, 1);
    el.textContent = text.slice(0, Math.round(p * text.length));
    if (p >= 1 && !done) { done = true; if (onDone) onDone(); }
  }, t0 + dur + 0.05);
}

/** Scramble-in text effect. */
function scrambleTo(id, finalText, dur) {
  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*<>/\\|";
  const t0 = showT;
  ticker((t) => {
    const el = document.getElementById(id);
    if (!el) return;
    const p = clamp((t - t0) / dur, 0, 1);
    const n = Math.floor(p * finalText.length);
    let out = finalText.slice(0, n);
    for (let i = n; i < finalText.length; i++) {
      out += CH[(Math.random() * CH.length) | 0];
    }
    el.textContent = out;
  }, t0 + dur + 0.05);
}

/** Random hex string. */
function hex(n) {
  let s = "";
  const C = "0123456789ABCDEF";
  for (let i = 0; i < n; i++) s += C[(Math.random() * 16) | 0];
  return s;
}

/* ============================================================
   9. TIMELINE ENGINE
   ============================================================ */
let showT = 0;
let lastT = 0;
let started = false;
let startTime = 0;

const EVENTS = [];
function at(t, fn) { EVENTS.push({ t: t, fn: fn, done: false }); }

let tickers = [];
function ticker(fn, until) { tickers.push({ fn: fn, until: until, dead: false }); }

function fireEvents(now) {
  for (let i = 0; i < EVENTS.length; i++) {
    const e = EVENTS[i];
    if (!e.done && now >= e.t) {
      e.done = true;
      try { e.fn(); } catch (err) { /* keep the reel alive */ console.warn(err); }
    }
  }
}

function runTickers(now, dt) {
  for (let i = 0; i < tickers.length; i++) {
    const tk = tickers[i];
    if (tk.dead) continue;
    if (tk.until !== undefined && now > tk.until) { tk.dead = true; continue; }
    tk.fn(now, dt);
  }
  tickers = tickers.filter((tk) => !tk.dead);
}

/* ============================================================
   10. SCENE BUILDERS
   ============================================================ */

/* ---------- SCENE 1 — BOOT / IMPACT (0 → 2.15) ---------- */
function sceneBoot() {
  bgTo({ grid: 0.55, nodes: 0.25 });
  hudOn(true);
  setLayer(
    '<div class="cutwrap bootwrap">' +
      '<div class="term">' +
        '<span class="c-grn">mhd@labs</span><span class="c-dim">:</span>' +
        '<span class="c-blu">~/core</span><span class="c-dim">$</span>&nbsp;' +
        '<span id="bootType"></span><span class="cur"></span>' +
      "</div>" +
      '<div class="boot-out" id="bootOut"></div>' +
    "</div>"
  );
  typeInto("bootType", "./init --mhd --reel --force", 0.7, 0.05);
  Snd.blip(880, 0.05, "square", 0.2);
}

function bootLines() {
  const out = $("#bootOut");
  if (!out) return;
  const lines = [
    ["[ ok ] mounting /dev/mhd", "c-dim"],
    ["[ ok ] loading kernel modules", "c-dim"],
    ["[ ok ] render pipeline online", "c-dim"],
    ["[ ok ] typography engine ready", "c-dim"],
    ["[warn] visual overload imminent", "c-red"]
  ];
  out.innerHTML = lines.map((l, i) =>
    '<div class="' + l[1] + '" style="animation-delay:' + (i * 0.055).toFixed(3) + 's">' + l[0] + "</div>"
  ).join("");
}

function impactReveal() {
  setLayer(
    '<div class="impact">' +
      '<div class="impact-sub">// SYSTEM ONLINE</div>' +
      '<div class="wm-wrap" id="wmWrap">' +
        '<div class="wm-layer wm-r">MHDLabs</div>' +
        '<div class="wm-layer wm-c">MHDLabs</div>' +
        '<div class="wm-layer wm-base">' + assembleWord("MHDLabs") + "</div>" +

function overloadTick(t, dt) {
  if (!OV) return;
  OV.t += dt;

  /* metrics — updated ~20fps to avoid layout thrash */
  OV.procT += dt;
  if (OV.procT > 0.05) {
    OV.procT = 0;
    const cpu = 62 + Math.sin(t * 3.1) * 26 + rnd(-6, 6);
    const gpu = 48 + Math.sin(t * 2.3 + 1.4) * 34 + rnd(-8, 8);
    const mem = 40 + Math.sin(t * 1.1) * 14 + rnd(-4, 4);
    const net = 55 + Math.sin(t * 4.4 + 2) * 38 + rnd(-10, 10);
    const cl = (v) => clamp(Math.round(v), 3, 100);

    OV.cpu.style.width = cl(cpu) + "%";
    OV.cpuV.textContent = cl(cpu) + "%";
    OV.gpu.style.width = cl(gpu) + "%";
    OV.gpuV.textContent = cl(gpu) + "%";
    OV.mem.style.width = cl(mem) + "%";
    OV.memV.textContent = cl(mem) + "%";
    OV.net.style.width = cl(net) + "%";
    OV.netV.textContent = cl(net) + "%";
    OV.net.classList.toggle("warn", cl(net) > 82);
    OV.gpu.classList.toggle("warn", cl(gpu) > 88);

    /* sparkline */
    for (let i = 0; i < OV.sparkBars.length; i++) {
      const v = 3 + Math.abs(Math.sin(t * 2.6 + i * 0.55)) * 30 + rnd(0, 5);
      OV.sparkBars[i].style.height = v.toFixed(0) + "px";
    }

    OV.tp.textContent = (1200 + Math.round(Math.abs(Math.sin(t * 1.7)) * 800)) + " ops/s";
    OV.uptime.textContent = "UPTIME " + formatTC(t - 10.5);

  OV.queueT += dt;
  if (OV.queueT > 0.28) {
    OV.queueT = 0;
    const cmds = ["build", "render", "compile", "pack", "lint", "deploy", "test", "diff", "push", "hash", "sign"];

/* ============================================================
   12. MAIN LOOP
   ============================================================ */
function loop(ts) {
  requestAnimationFrame(loop);

  if (!started) {
    started = true;
    startTime = ts;
  }
  showT = (ts - startTime) / 1000;
  const dt = Math.min(showT - lastT, 0.05);
  lastT = showT;

  /* timeline + logic */
  fireEvents(showT);
  runTickers(showT, dt);

  /* rendering */
  bgUpdate(dt);
  drawBG(showT, dt);
  fxUpdate(dt);
  updateScreenFX(dt);

  /* HUD timecode — throttled */
  tcAccum += dt;
  if (tcAccum > 0.05) {
    tcAccum = 0;
    hudTC.textContent = formatTC(showT);
  }
}

/* ============================================================
   13. BOOTSTRAP
   ============================================================ */
function boot() {
  resize();
  buildNoise();
  window.addEventListener("resize", () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(resize, 120);
  }, { passive: true });

  /* restart shortcut */
  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") location.reload();
  });

  requestAnimationFrame(loop);
}

boot();
