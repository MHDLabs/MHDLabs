<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi | MHDLabs</title>
  <desc id="desc">A light terminal-inspired profile banner for Mahdi, featuring Linux, privacy, local AI, and open-source projects.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dce3ea" stroke-width="1" opacity=".72"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f07835" stop-opacity=".13"/>
      <stop offset="1" stop-color="#16836b" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="430" rx="22" fill="#f6f8fa"/>
  <rect width="1100" height="430" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1098" height="428" rx="21" fill="none" stroke="#cbd5df" stroke-width="2"/>
  <circle cx="1030" cy="62" r="110" fill="url(#glow)"/>

  <!-- Terminal window -->
  <rect x="35" y="48" width="405" height="328" rx="15" fill="#ffffff" stroke="#c4ced9" stroke-width="2"/>
  <path d="M35 88H440" stroke="#d4dde6" stroke-width="2"/>
  <circle cx="61" cy="68" r="6" fill="#d84a4a"/>
  <circle cx="83" cy="68" r="6" fill="#c58b18"/>
  <circle cx="105" cy="68" r="6" fill="#16836b"/>
  <text x="237" y="73" text-anchor="middle" fill="#697887" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">MHD / TERMINAL</text>
  <text x="62" y="123" fill="#b84a08" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">$ whoami</text>
  <text x="62" y="151" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">mahdi</text>
  <text x="62" y="193" fill="#b84a08" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">$ uname -s</text>
  <text x="62" y="221" fill="#116b55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Linux</text>
  <text x="62" y="263" fill="#b84a08" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">$ cat interests.txt</text>
  <text x="62" y="292" fill="#465362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">privacy · self-hosting · local AI</text>
  <text x="62" y="338" fill="#116b55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">&gt; <tspan fill="#24292f">_</tspan><animate attributeName="opacity" values="1;0;1" dur="1.25s" repeatCount="indefinite"/></text>

  <!-- Identity panel -->
  <text x="488" y="82" fill="#b84a08" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">OPEN SOURCE / PERSONAL PROFILE</text>
  <text x="485" y="151" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="800">Mahdi</text>
  <text x="490" y="187" fill="#116b55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">@MHDLabs</text>
  <rect x="490" y="213" width="260" height="37" rx="8" fill="#edf3f7" stroke="#cbd5df"/>
  <text x="508" y="237" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Student &amp; builder</text>
  <text x="490" y="288" fill="#697887" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">FOCUS</text>
  <text x="595" y="288" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Linux · Privacy · Open source</text>
  <text x="490" y="321" fill="#697887" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">BUILD</text>
  <text x="595" y="321" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">JavaScript · Python · Cloudflare</text>
  <text x="490" y="354" fill="#697887" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">EXPLORE</text>
  <text x="595" y="354" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Local AI · System tools</text>

  <rect x="865" y="48" width="195" height="34" rx="17" fill="#e5f5ef" stroke="#9acdbd"/>
  <circle cx="885" cy="65" r="5" fill="#16836b"/>
  <text x="900" y="70" fill="#116b55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">STATUS: BUILDING</text>
  <path d="M488 390H1060" stroke="#d0d8e0" stroke-width="1"/>
  <text x="490" y="412" fill="#697887" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Keep it simple. Keep it useful. Keep learning.</text>
  <text x="1060" y="412" text-anchor="end" fill="#b84a08" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">[ MHD ]</text>
</svg>
